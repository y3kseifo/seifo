<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="style.css" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.birds.min.js"></script>

    <script>
      window.addEventListener("DOMContentLoaded", () => {
        VANTA.BIRDS({
          el: "#vanta",
          mouseControls: true,
          touchControls: true,
          gyroControls: false,
          minHeight: 200.0,
          minWidth: 200.0,
          scale: 1.0,
          scaleMobile: 1.0,
          backgroundAlpha: 0.0,
          color2: 0xff00f0,
          wingSpan: 40.0,
          separation: 100.0,
          alignment: 77.0,
          cohesion: 5.0,
          quantity: 2.0,
        });

        setTimeout(() => {
          const main = document.querySelector("main");
          main.style.opacity = 1;
          main.style.filter = "blur(0px)";
        }, 1000);
      });
    </script>

    <title>fww.seifo or fww.seifo1</title>
  </head>

  <body>
    <!-- Background video -->
    <video
      id="background-video"
      autoplay
      muted
      loop
      playsinline
    >
      <source
        src="./assets/images/videoplayback.mp4"
        type="video/mp4"
      />
      Your browser does not support the video tag.
    </video>

    <!-- Vanta background -->
    <div id="vanta"></div>

    <!-- Sound button -->
    <button id="sound-btn" type="button">
      🔇 Click for sound
    </button>

    <main>
      <header>
        <img
          src="https://i.ibb.co/LXg0yHH4/Screenshot-2026-08-13-at-4-11-39-PM.png"
          alt="Anurag's GitHub avatar"
        />

        <h1>@fww.seifo</h1>
      </header>

      <ul>
        <li>
          <a
            href="https://tiktok.com/@fww.seifo"
            target="_blank"
            rel="noreferrer noopener"
          >
            <img
              src="assets/images/tiktok.jpeg"
              alt="TikTok"
              width="20"
            />
            TikTok
          </a>
        </li>

        <li>
          <a
            href="https://instagram.com/fww.seifo1/"
            target="_blank"
            rel="noreferrer noopener"
          >
            <img
              src="assets/images/instagram.jpeg"
              alt="Instagram"
              width="20"
            />
            Instagram
          </a>
        </li>

        <li>
          <a
            href="https://www.snapchat.com/@fww.seifo1"
            target="_blank"
            rel="noreferrer noopener"
          >
            <img
              src="assets/images/snapchat.png"
              alt="Snapchat"
              width="20"
            />
            Snapchat
          </a>
        </li>
      </ul>
    </main>

    <script>
      const video = document.getElementById("background-video");
      const soundButton = document.getElementById("sound-btn");

      soundButton.addEventListener("click", () => {
        video.muted = false;
        video.volume = 1;
        video.play();

        soundButton.textContent = "🔊 Sound on";
        
        setTimeout(() => {
          soundButton.style.opacity = "0";
          setTimeout(() => {
            soundButton.style.display = "none";
          }, 500);
        }, 1000);
      });
    </script>
  </body>
</html>
